[build-system]
requires = ["setuptools>=64,<83", "setuptools-scm>=8,<10"]
build-backend = "setuptools.build_meta"

[project]
name = "geoid-flood"
version = "1.0.0"
authors = [
    { name = "Gaetano Chiriaco", email = "gaetano.chiriaco@linksfoundation.com" },
    { name = "Edoardo Arnaudo", email = "edoardo.arnaudo@linksfoundation.com" },
]
description = "GEOID-Flood: a large-scale multi-modal benchmark for flood segmentation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "olmoearth-pretrain>=0.1,<0.2",
    "terratorch==1.1",
]

[project.optional-dependencies]
# Dependencies of the scripts under scripts/
scripts = [
    "huggingface_hub>=1.0,<2",
    "pyarrow>=14,<23",
    "pyyaml>=6,<7",
    "tensorboard>=2.14,<3",
    "torchmetrics>=1.4,<2",
    "tqdm>=4.66,<5",
]

# Test suite for the scripts above
dev = [
    "pytest>=8,<9",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.black]
line-length = 119

[tool.ruff]
line-length = 119
src = ["src"]
select = ["E", "F", "UP"]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.uv.sources]
olmoearth-pretrain = { git = "https://github.com/allenai/olmoearth_pretrain.git", rev = "2c5c7a07883f3d834e5cdf2b8288ed2c52a78fa1" }
